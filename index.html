<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARM REVIX - MOVE TO EARN</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background: #1e1e2f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { color: #4ef083; margin-bottom: 20px; }
        .counter { font-size: 48px; font-weight: bold; margin: 20px 0; color: #fff; }
        button { background: linear-gradient(90deg, #4ef083, #11998e); border: none; color: white; padding: 15px; font-size: 18px; border-radius: 50px; width: 100%; margin-bottom: 15px; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: 0.3s; }
        button:hover { transform: scale(1.05); }
        #downloadBtn { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Move To Earn</h1>
        <div id="stepCount" class="counter">0</div>
        
        <!-- Ստանալ պարգևը կոճակը -->
        <button onclick="claimReward()">Ստանալ Պարգևը</button>

        <!-- Ներբեռնելու կոճակը (ուղիղ հղումով) -->
        <a href="https://www.webintoapp.com/download/zip/1405538/MAN%20REVIX%201.0.zip?dHWmQZX4zWAq" style="text-decoration:none;">
            <button id="downloadBtn">ՆԵՐԲԵՌՆԵԼ ՀԱՎԵԼՎԱԾԸ (APK)</button>
        </a>
    </div>

    <script>
        let steps = 0;
        setInterval(() => { steps += 1; document.getElementById('stepCount').innerText = steps; }, 1000);

        function claimReward() {
            if (steps < 10) { alert("Շարունակեք քայլել!"); return; }
            window.open("https://www.effectivecpmnetwork.com/qshps65d?key=2eab53f97fb58d9a2c1859a7e35251e2", '_blank');
            steps = 0;
        }
    </script>

</body>
</html>
