<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARM REVIX</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0f172a; color: white; }
        .page { display: none; padding: 20px; }
        .active { display: block; }
        /* Կայքի դիզայն */
        .landing { text-align: center; padding-top: 50px; }
        .btn { background: #22c55e; padding: 15px 30px; border-radius: 30px; color: black; font-weight: bold; text-decoration: none; display: inline-block; }
        /* Հավելվածի դիզայն (Login) */
        .app-screen { text-align: center; }
    </style>
</head>
<body>

    <div id="landingPage" class="page active landing">
        <h1>ARM REVIX</h1>
        <p>Լավագույն հավելվածը քայլերի համար։</p>
        <a href="https://www.webintoapp.com/download/..." class="btn">ՆԵՐԲԵՌՆԵԼ APK</a>
    </div>

    <div id="appPage" class="page">
        <h1>ՄՈՒՏՔ</h1>
        <input type="text" placeholder="Օգտանուն"><br>
        <button onclick="enterApp()">Մտնել հաշիվ</button>
    </div>

    <script>
        // Եթե սա հավելված է, ցույց տուր AppPage-ը
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('landingPage').classList.remove('active');
            document.getElementById('appPage').classList.add('active');
        }

        function enterApp() {
            // Այստեղ կավելացնենք հիմնական քայլաչափի էկրանը
            alert("Բարի գալուստ ARM REVIX!");
        }
    </script>
</body>
</html>
