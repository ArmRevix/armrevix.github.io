<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAN REVIX</title>
    <style>
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: linear-gradient(180deg, #10b981 0%, #064e3b 100%); 
            color: white; text-align: center; height: 100vh;
        }
        .container { padding: 20px; }
        .header { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-align: left; }
        .card { 
            background: rgba(255, 255, 255, 0.2); padding: 30px; 
            border-radius: 25px; backdrop-filter: blur(10px); margin-bottom: 20px;
        }
        .steps-label { font-size: 14px; opacity: 0.9; text-transform: uppercase; }
        .steps-count { font-size: 60px; font-weight: bold; margin: 10px 0; }
        .claim-btn { 
            background: white; color: #064e3b; padding: 15px 40px; 
            border-radius: 50px; font-weight: bold; border: none; 
            font-size: 18px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">MAN REVIX</div>
    
    <div class="card">
        <div class="steps-label">TODAY'S STEPS</div>
        <div id="steps" class="steps-count">0</div>
        <button class="claim-btn" onclick="claimReward()">CLAIM</button>
    </div>
</div>

<script>
    let stepCount = 0;

    // Սենսորների միացում
    window.onload = function() {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(response => {
                if (response == 'granted') {
                    window.addEventListener('devicemotion', handleMotion);
                }
            });
        } else {
            window.addEventListener('devicemotion', handleMotion);
        }
    };

    // Քայլերի հաշվարկ
    function handleMotion(event) {
        let acc = event.accelerationIncludingGravity;
        let movement = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
        if (movement > 25) { // Զգայունություն
            stepCount++;
            document.getElementById('steps').innerText = stepCount;
        }
    }

    // Գովազդի ֆունկցիա
    function claimReward() {
        if (stepCount < 20) {
            alert("Քայլիր ավելի շատ!");
        } else {
            stepCount = 0;
            document.getElementById('steps').innerText = 0;
            window.location.href = "https://www.effectivecpmnetwork.com/qshps65d?key=2eab53f97fb58d9a2c1859a7e35251e2";
        }
    }
</script>

</body>
</html>
