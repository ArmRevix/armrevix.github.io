<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARM REVIX</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #0f2e26; color: white; text-align: center; }
        .header { padding: 15px; background: #000; font-size: 18px; border-bottom: 2px solid #f59e0b; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 40px; margin: 20px auto; border-radius: 20px; max-width: 400px; }
        .count { font-size: 60px; font-weight: bold; margin: 20px 0; color: #f59e0b; }
        .earn-btn { background: #f59e0b; color: #000; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; }
        .earn-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        REVIX COINS: <span id="coinCountHeader">0</span>
    </div>

    <div class="card">
        <div style="font-size: 20px;">ԸՆԴԱՄԵՆԸ</div>
        <div class="count" id="coinCountDisplay">0</div>
        <button class="earn-btn" onclick="openAd()">+200 REVIX (Դիտել)</button>
    </div>

    <script>
        // Սկզբնական քոինների քանակ
        let coins = 0;

        function openAd() {
            // 1. Գովազդի հղումը
            const adUrl = 'https://www.effectivecpmnetwork.com/qshps65d?key=2eab53f97fb58d9a2c1859a7e35251e2';
            
            // 2. Բացում ենք գովազդը նոր պատուհանում
            window.open(adUrl, '_blank');
            
            // 3. Ավելացնում ենք քոինները և թարմացնում էկրանը
            coins += 200;
            document.getElementById('coinCountHeader').innerText = coins;
            document.getElementById('coinCountDisplay').innerText = coins;
            
            // 4. (Լրացուցիչ) Պահում ենք քոինները բրաուզերի հիշողության մեջ, 
            // որպեսզի էջը թարմացնելիս չկորչեն
            localStorage.setItem('revixCoins', coins);
        }

        // Ստուգում ենք՝ արդյոք նախկինում կուտակված քոիններ կան
        window.onload = function() {
            let savedCoins = localStorage.getItem('revixCoins');
            if (savedCoins) {
                coins = parseInt(savedCoins);
                document.getElementById('coinCountHeader').innerText = coins;
                document.getElementById('coinCountDisplay').innerText = coins;
            }
        };
    </script>
</body>
</html>
